<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문자 멘트함</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --sub:#6b7385; --line:#e3e6ec;
    --pri:#3b6cf6; --pri-weak:#e8eefe; --ok:#1f9d61; --ok-weak:#e3f6ec;
    --warn:#d9822b; --warn-weak:#fdf1e4; --del:#e5484d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font:inherit;color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  header h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--sub)}
