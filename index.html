<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문자 멘트함</title>
<style>
  :root{
    --bg:#c9d8f5; --card:#fff; --ink:#1d2433; --sub:#6b7385; --line:#e3e6ec;
    --pri:#3b6cf6; --pri-weak:#e8eefe; --ok:#1f9d61; --ok-weak:#e3f6ec;
    --warn:#d9822b; --warn-weak:#fdf1e4; --del:#e5484d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font:inherit;color:inherit}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 96px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  header h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .badge{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--line);color:var(--sub)}
  .badge.on{background:var(--ok-weak);color:var(--ok)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stack>*+*{margin-top:10px}
  label.t{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
  textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
  textarea{min-height:110px;resize:vertical}
  textarea:focus,input:focus{border-color:var(--pri)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;font-weight:700;background:var(--pri);color:#fff}
  .btn.full{width:100%}
  .btn.ghost{background:var(--pri-weak);color:var(--pri)}
  .btn.gray{background:var(--line);color:var(--ink)}
  .btn.ok{background:var(--ok)}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;align-items:center}
  .row.wrapx{flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--sub)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .muted{color:var(--sub);font-size:13px}
  .count{font-size:12px;color:var(--sub);text-align:right}

  /* list */
  .ment{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px}
  .ment+.ment{margin-top:10px}
  .ment.pick{border:2px solid var(--pri)}
  .ment .txt{white-space:pre-wrap;word-break:break-all}
  .ment .meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
  .ment .tag{font-size:12px;color:var(--pri);background:var(--pri-weak);padding:2px 8px;border-radius:99px}
  .ment .acts{display:flex;gap:4px;align-items:center}
  .icon-btn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--sub)}
  .icon-btn:active{background:var(--line)}
  .copy-btn{padding:7px 14px;border-radius:9px;background:var(--ink);color:#fff;font-weight:700;font-size:13px}
  .copy-btn.done{background:var(--ok)}
  .empty{text-align:center;color:var(--sub);padding:40px 10px}

  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav .in{max-width:640px;margin:0 auto;display:flex}
  nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub)}
  nav button.on{color:var(--pri);font-weight:700}
  nav svg{width:22px;height:22px}
  .page{display:none}.page.on{display:block}

  /* suggestions */
  .sug{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
  .sug+.sug{margin-top:10px}
  .sug .txt{white-space:pre-wrap;word-break:break-all}
  .sug .row{margin-top:10px;justify-content:flex-end}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .mask.on{display:flex}
  .modal{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  @media(min-width:700px){.mask{align-items:center}.modal{border-radius:18px}}
  .modal h2{font-size:17px;margin-bottom:12px}
  .cmp{border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-all}
  .cmp.before{background:#f3f4f6;color:var(--sub)}
  .cmp.after{background:var(--ok-weak)}
  mark{background:#ffe08a;border-radius:3px;padding:0 1px}
  .chg{font-size:13px;padding:7px 10px;border-radius:8px;background:var(--warn-weak)}
  .chg+.chg{margin-top:6px}
  .chg b{color:var(--del);text-decoration:line-through;font-weight:600}
  .chg i{color:var(--ok);font-style:normal;font-weight:700}
  .chg .why{color:var(--sub);display:block;margin-top:2px}

  .toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  .btn.ghost .spin{border-color:rgba(59,108,246,.3);border-top-color:var(--pri)}
  @keyframes sp{to{transform:rotate(360deg)}}
  .switch{position:relative;width:46px;height:28px;flex:none}
  .switch input{display:none}
  .switch span{position:absolute;inset:0;background:#cfd4dd;border-radius:99px;transition:.2s}
  .switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked+span{background:var(--pri)}
  .switch input:checked+span::after{left:21px}
  .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .notice{font-size:13px;background:var(--pri-weak);color:#2a4aa8;border-radius:10px;padding:10px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>문자 멘트함</h1>
    <span id="aiBadge" class="badge">AI 꺼짐</span>
  </header>

  <!-- 내 멘트 -->
  <section id="p-list" class="page on">
    <div class="stack">
      <input type="text" id="q" placeholder="멘트 검색">
      <div class="chips" id="catFilter"></div>
      <div class="between">
        <span class="muted" id="listCount"></span>
        <div class="chips">
          <button class="chip on" data-sort="recent">최근순</button>
          <button class="chip" data-sort="uses">자주 쓴 순</button>
        </div>
      </div>
    </div>
    <div id="list" style="margin-top:12px"></div>
  </section>

  <!-- 추가 -->
  <section id="p-add" class="page">
    <div class="card stack">
      <div>
        <label class="t">멘트 내용</label>
        <textarea id="addText" placeholder="저장할 문자 멘트를 입력하세요"></textarea>
        <div class="count" id="addCount">0자</div>
      </div>
      <div>
        <label class="t">분류 (선택)</label>
        <input type="text" id="addCat" placeholder="비워 두면 자동 분류 (건강·시험·출결·행사 등)" list="catList">
        <div class="chips" id="addCatChips" style="margin-top:8px"></div>
      </div>
      <button class="btn full" id="addBtn">맞춤법 검사 후 저장</button>
      <button class="btn full gray" id="addNara">바른한글(부산대 검사기)에서 확인</button>
      <p class="muted" id="addHint"></p>
    </div>
  </section>

  <!-- 제안 -->
  <section id="p-sug" class="page">
    <div class="card stack">
      <div>
        <label class="t">어떤 문자를 보내고 싶으세요?</label>
        <textarea id="sugText" style="min-height:80px" placeholder="예: 내일 현장체험학습 준비물(도시락, 물) 안내, 8시 40분까지 등교"></textarea>
      </div>
      <div>
        <label class="t">길이</label>
        <div class="chips" id="sugLen">
          <button class="chip on" data-len="짧게">아주 짧게</button>
          <button class="chip" data-len="보통">보통</button>
        </div>
      </div>
      <button class="btn full" id="sugBtn">멘트 제안받기</button>
      <p class="muted">담임교사가 학부모님께 보내는 문자로, 맞춤법을 지켜 간결하게 제안합니다.</p>
    </div>
    <div id="sugOut" style="margin-top:12px"></div>
  </section>

  <!-- 설정 -->
  <section id="p-set" class="page">
    <div class="card stack">
      <div>
        <label class="t">Claude API 키</label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
        <p class="muted" style="margin-top:6px">키는 이 기기의 브라우저에만 저장되고, 깃허브에 올린 코드에는 들어가지 않습니다. AI 맞춤법 검사와 멘트 제안에 쓰입니다.</p>
      </div>
      <div>
        <label class="t">모델</label>
        <input type="text" id="model" list="modelList">
        <datalist id="modelList">
          <option value="claude-sonnet-5-5">
          <option value="claude-haiku-5-5">
        </datalist>
        <p class="muted" style="margin-top:6px">haiku는 더 빠르고 저렴, sonnet은 더 정확합니다.</p>
      </div>
      <div>
        <label class="t">서명 (제안 멘트 끝에 사용, 선택)</label>
        <input type="text" id="sign" placeholder="예: 2학년 6반 담임 OOO 드림">
      </div>
      <div class="between">
        <div>
          <div style="font-weight:700">저장할 때 맞춤법 검사</div>
          <div class="muted">끄면 입력한 그대로 바로 저장</div>
        </div>
        <label class="switch"><input type="checkbox" id="autoCheck"><span></span></label>
      </div>
      <button class="btn full" id="saveSet">설정 저장</button>
      <button class="btn full ghost" id="testApi">API 연결 테스트</button>
    </div>

    <div class="card stack" style="margin-top:12px">
      <label class="t" style="margin:0">백업</label>
      <p class="muted">멘트는 이 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업하세요.</p>
      <div class="row">
        <button class="btn gray" style="flex:1" id="exportBtn">내보내기</button>
        <button class="btn gray" style="flex:1" id="importBtn">불러오기</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </section>
</div>

<datalist id="catList"></datalist>

<nav><div class="in">
  <button data-go="list" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>내 멘트</button>
  <button data-go="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>추가</button>
  <button data-go="sug">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>제안</button>
  <button data-go="set">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</div></nav>

<!-- 맞춤법 결과 모달 -->
<div class="mask" id="chkMask"><div class="modal stack">
  <h2 id="chkTitle">맞춤법 검사 결과</h2>
  <div id="chkNote" class="notice" style="display:none"></div>
  <div><label class="t">원문</label><div class="cmp before" id="chkBefore"></div></div>
  <div><label class="t">수정본 (직접 고칠 수 있어요)</label><textarea id="chkAfter"></textarea></div>
  <div id="chkList"></div>
  <button class="btn full gray" id="chkNara">수정본을 바른한글(부산대 검사기)에서 확인</button>
  <div class="row">
    <button class="btn gray" id="chkCancel">취소</button>
    <button class="btn ghost" style="flex:1" id="chkOrig">원문대로 저장</button>
    <button class="btn ok" style="flex:1" id="chkFix">수정본 저장</button>
  </div>
</div></div>

<!-- 편집 모달 -->
<div class="mask" id="editMask"><div class="modal stack">
  <h2>멘트 수정</h2>
  <textarea id="editText" style="min-height:140px"></textarea>
  <input type="text" id="editCat" placeholder="분류 (비워 두면 자동 분류)" list="catList">
  <div class="row">
    <button class="btn gray" id="editCancel">취소</button>
    <button class="btn" style="flex:1" id="editSave">맞춤법 검사 후 저장</button>
  </div>
</div></div>

<!-- 확인 모달 -->
<div class="mask" id="cfmMask"><div class="modal stack">
  <h2 id="cfmMsg"></h2>
  <div class="row">
    <button class="btn gray" style="flex:1" id="cfmNo">취소</button>
    <button class="btn" style="flex:1;background:var(--del)" id="cfmYes">삭제</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY_DATA = 'mentbox_items_v1';
  const KEY_SET = 'mentbox_settings_v1';
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  /* ---------- storage ---------- */
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast('저장 공간 오류'); } };

  let items = load(KEY_DATA, []);
  let settings = Object.assign({ apiKey:'', model:'claude-sonnet-5-5', sign:'', autoCheck:true }, load(KEY_SET, {}));
  let sortMode = 'recent', catSel = '전체', sugLen = '짧게';

  const saveItems = () => store(KEY_DATA, items);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- toast ---------- */
  let tT;
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('on'),1800); }

  /* ---------- nav ---------- */
  $$('nav button').forEach(b => b.onclick = () => go(b.dataset.go));
  function go(p){
    $$('nav button').forEach(x => x.classList.toggle('on', x.dataset.go===p));
    $$('.page').forEach(x => x.classList.toggle('on', x.id==='p-'+p));
    if (p==='list') renderList();
    if (p==='add') renderAddCats();
    window.scrollTo(0,0);
  }

  /* ---------- copy ---------- */
  async function copyText(text){
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); let ok=false;
      try { ok=document.execCommand('copy'); } catch {}
      ta.remove(); return ok;
    }
  }

  /* ---------- 자동 분류 (키워드 기반, 위에서부터 먼저 맞는 것) ---------- */
  const CAT_RULES = [
    ['건강', ['감기','독감','코로나','발열','열이','기침','아파','아픈','병원','진료','보건','감염','장염','다쳐','다친','부상']],
    ['시험', ['시험','고사','지필','수행평가','평가','성적']],
    ['출결', ['지각','결석','조퇴','출석','출결']],
    ['행사', ['체험학습','소풍','수학여행','수련회','축제','체육대회','운동회','행사','견학','졸업식','입학식','방학식','개학']],
    ['상담', ['상담','면담']],
    ['제출', ['가정통신문','제출','신청서','동의서']],
    ['준비물', ['준비물','챙겨','지참']],
    ['감사', ['고맙','덕분','감사의']],
    ['안부', ['잘 지내','환절기','날씨','명절','추석','설날','새해','연휴','건강하시','건강히','평안']],
  ];
  const CAT_FIXED = ['안부','건강','안내','시험','출결','행사','상담','제출','준비물','감사'];
  function autoCat(text){
    for (const [cat, words] of CAT_RULES) if (words.some(w => text.includes(w))) return cat;
    return '안내';
  }

  /* ---------- 바른한글(부산대) 검사기 열기 ---------- */
  const NARA_URL = 'https://nara-speller.co.kr/speller/';
  function openNara(text){
    if (!text.trim()) return toast('멘트를 입력하세요');
    // 복사와 새 탭 열기를 같은 클릭 안에서 바로 실행 (팝업 차단 방지)
    copyText(text).then(ok => toast(ok ? '복사했어요 — 검사기 입력창에 붙여넣기 하세요' : '복사 실패 — 직접 복사해 붙여넣으세요'));
    window.open(NARA_URL, '_blank', 'noopener');
  }
  $('#addNara').onclick = () => openNara($('#addText').value);
  $('#chkNara').onclick = () => openNara($('#chkAfter').value);

  /* ---------- 오프라인 기본 검사 (자주 틀리는 표현) ---------- */
  const RULES = [
    [/되요/g,'돼요','‘되어요’의 준말은 ‘돼요’'],
    [/되서/g,'돼서','‘되어서’의 준말은 ‘돼서’'],
    [/됬/g,'됐','‘되었-’의 준말은 ‘됐-’'],
    [/됀/g,'된','‘된’이 바른 표기'],
    [/뵈요/g,'봬요','‘뵈어요’의 준말은 ‘봬요’'],
    [/뵜/g,'뵀','‘뵈었-’의 준말은 ‘뵀-’'],

    [/아니예요/g,'아니에요','‘아니다’ 뒤에는 ‘-에요’'],
    [/어의없/g,'어이없','‘어이없다’가 바른 표기'],
    [/바램/g,'바람','‘바라다’의 명사형은 ‘바람’'],
  ];
  // ㄹ받침 + 께(요) → 게(요)  예: 할께요→할게요, 드릴께요→드릴게요
  const hasRieulBatchim = ch => { const c=ch.charCodeAt(0)-0xAC00; return c>=0 && c<11172 && c%28===8; };
  // ~구요 → ~고요
  function localCheck(text){
    let out = text; const changes = [];
    for (const [re,to,why] of RULES){
      out = out.replace(re, m => { if (m!==to) changes.push({from:m,to,reason:why}); return to; });
    }
    out = out.replace(/([가-힣])께(요|$|[\s.,!?~])/g, (m,a,b) => {
      if (!hasRieulBatchim(a)) return m;
      changes.push({from:a+'께',to:a+'게',reason:'약속·의지를 나타내는 어미는 ‘-ㄹ게’'}); return a+'게'+b;
    });
    out = out.replace(/([가-힣])구요/g, (m,a) => {
      changes.push({from:a+'구요',to:a+'고요',reason:'연결 어미 ‘-고’에 ‘요’가 붙은 형태는 ‘-고요’'}); return a+'고요';
    });
    return { corrected: out, changes };
  }

  /* ---------- Claude API ---------- */
  const hasAI = () => !!settings.apiKey.trim();
  async function callClaude(system, user, maxTokens=1500){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':settings.apiKey.trim(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({ model:settings.model.trim()||'claude-sonnet-5-5', max_tokens:maxTokens, system, messages:[{role:'user',content:user}] })
    });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data?.error?.message || ('HTTP '+res.status));
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    return parseJSON(text);
  }
  function parseJSON(t){
    t = t.replace(/```json|```/g,'').trim();
    const s=t.indexOf('{'), e=t.lastIndexOf('}');
    if (s<0||e<0) throw new Error('응답 형식 오류');
    return JSON.parse(t.slice(s,e+1));
  }

  const SPELL_SYS = `당신은 한국어 맞춤법 검사기입니다. 국립국어원 표준어 규정과 한글 맞춤법(띄어쓰기 포함)을 기준으로 검사합니다.
규칙:
- 맞춤법, 띄어쓰기, 문장부호, 명백한 문법 오류만 고칩니다.
- 표현·어조·문체·내용·줄바꿈·이모지는 절대 바꾸지 않습니다. 더 좋은 표현으로 바꾸는 것은 금지입니다.
- 보조 용언 붙여쓰기처럼 규정상 둘 다 허용되는 것은 고치지 않습니다.
- 확실한 오류만 고칩니다. 오류가 없으면 원문 그대로 돌려줍니다.
반드시 아래 JSON만 출력합니다:
{"corrected":"수정된 전체 문장","changes":[{"from":"틀린 부분","to":"고친 부분","reason":"짧은 이유"}]}`;

  async function aiSpell(text){
    const r = await callClaude(SPELL_SYS, '다음 문자를 검사하세요:\n"""\n'+text+'\n"""');
    return { corrected: typeof r.corrected==='string' ? r.corrected : text, changes: Array.isArray(r.changes)?r.changes:[] };
  }

  /* 전체 검사: 기본검사 → AI검사 */
  async function fullCheck(text){
    const loc = localCheck(text);
    let corrected = loc.corrected, changes = [...loc.changes], note = '';
    if (hasAI()){
      try {
        const ai = await aiSpell(corrected);
        corrected = ai.corrected;
        changes = changes.concat(ai.changes.filter(c=>c && c.from!==c.to));
      } catch(e){ note = 'AI 검사 실패('+e.message+'). 자주 틀리는 표현만 검사했어요.'; }
    } else {
      note = 'API 키가 없어 자주 틀리는 표현만 검사했어요. 설정에서 키를 넣으면 AI가 띄어쓰기까지 검사합니다.';
    }
    return { corrected, changes, note };
  }

  /* ---------- 검사 모달 ---------- */
  let chkResolve = null;
  function showCheck(orig, res){
    return new Promise(resolve => {
      chkResolve = resolve;
      const same = res.corrected.trim() === orig.trim();
      $('#chkTitle').textContent = same ? '맞춤법 이상 없음' : '맞춤법 검사 결과';
      $('#chkNote').style.display = res.note ? 'block' : 'none';
      $('#chkNote').textContent = res.note;
      $('#chkBefore').innerHTML = highlight(orig, res.changes.map(c=>c.from));
      $('#chkAfter').value = res.corrected;
      $('#chkList').innerHTML = res.changes.length
        ? res.changes.map(c=>`<div class="chg"><b>${esc(c.from)}</b> → <i>${esc(c.to)}</i>${c.reason?`<span class="why">${esc(c.reason)}</span>`:''}</div>`).join('')
        : '';
      $('#chkOrig').style.display = same ? 'none' : '';
      $('#chkFix').textContent = same ? '저장' : '수정본 저장';
      $('#chkMask').classList.add('on');
      setTimeout(()=>autoGrow($('#chkAfter')),0);
    });
  }
  function highlight(text, words){
    let h = esc(text);
    [...new Set(words.filter(Boolean))].sort((a,b)=>b.length-a.length).forEach(w=>{
      const ew = esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      h = h.replace(new RegExp(ew,'g'), m=>`<mark>${m}</mark>`);
    });
    return h;
  }
  const closeChk = v => { $('#chkMask').classList.remove('on'); chkResolve && chkResolve(v); chkResolve=null; };
  $('#chkCancel').onclick = () => closeChk(null);

  /* 저장 전 검사 흐름: 반환값 = 저장할 텍스트 or null */

    const v = await showCheck(text, res);
    if (v===null) return null;
    if (v==='orig') return text;
    return v;
  }

      ta.addEventListener('input',()=>autoGrow(ta));
      el.querySelector('[data-act=copy]').onclick = async e => {
        if (await copyText(ta.value)){ const b=e.currentTarget; b.textContent='복사됨'; b.classList.add('done'); setTimeout(()=>{b.textContent='복사';b.classList.remove('done');},1200); toast('복사했어요'); }
        else toast('복사 실패');
      };
      el.querySelector('[data-act=save]').onclick = async e => {
        const b=e.currentTarget, t=ta.value.trim(); if(!t) return;
        // 제안문은 이미 AI가 맞춤법을 지켜 작성 — 사용자가 고쳤을 수 있으니 저장 전 검사
        const final = await checkBeforeSave(t, b); if (final===null) return;
        const now=Date.now();
        const cat = autoCat(final);
        items.unshift({ id:uid(), text:final.trim(), cat, uses:0, createdAt:now, updatedAt:now });
        saveItems(); b.textContent='저장됨 ✓'; b.disabled=true; toast('멘트함에 저장했어요 · 분류: '+cat);
      };
    });
    $('#sugAgain').onclick = () => $('#sugBtn').click();
  }

  /* ---------- 설정 ---------- */
  function fillSet(){
    $('#apiKey').value=settings.apiKey; $('#model').value=settings.model; $('#sign').value=settings.sign; $('#autoCheck').checked=settings.autoCheck;
    const b=$('#aiBadge'); b.textContent = hasAI() ? 'AI 켜짐' : 'AI 꺼짐'; b.classList.toggle('on', hasAI());
  }
  $('#saveSet').onclick=()=>{
    settings.apiKey=$('#apiKey').value.trim(); settings.model=$('#model').value.trim()||'claude-sonnet-5-5';
    settings.sign=$('#sign').value.trim(); settings.autoCheck=$('#autoCheck').checked;
    store(KEY_SET, settings); fillSet(); toast('설정을 저장했어요');
  };
  $('#testApi').onclick=async()=>{
    settings.apiKey=$('#apiKey').value.trim(); settings.model=$('#model').value.trim()||'claude-sonnet-5-5';
    if(!hasAI()) return toast('API 키를 입력하세요');
    const b=$('#testApi'); b.disabled=true; b.innerHTML='<span class="spin"></span> 테스트 중…';
    try{ const r=await aiSpell('내일 뵈요'); toast('연결 성공 · 예: '+r.corrected); store(KEY_SET, settings); fillSet(); }
    catch(e){ toast('연결 실패: '+e.message); }
    finally{ b.disabled=false; b.textContent='API 연결 테스트'; }
  };

  /* ---------- 백업 ---------- */
  $('#exportBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify({app:'mentbox',version:1,items},null,2)],{type:'application/json'});
    const a=document.createElement('a'); const d=new Date();
    a.href=URL.createObjectURL(blob); a.download=`문자멘트_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const raw=(await f.text()).replace(/[​-‍﻿]/g,'');
      const data=JSON.parse(raw); const arr=Array.isArray(data)?data:data.items;
      if(!Array.isArray(arr)) throw 0;
      const ids=new Set(items.map(i=>i.id)); let n=0;
      arr.forEach(i=>{ if(i&&typeof i.text==='string'&&!ids.has(i.id)){ items.push({id:i.id||uid(),text:i.text,cat:i.cat||'',uses:i.uses||0,createdAt:i.createdAt||Date.now(),updatedAt:i.updatedAt||Date.now()}); n++; } });
      saveItems(); toast(`${n}개 불러왔어요`);
    }catch{ toast('불러오기 실패 — 파일을 확인하세요'); }
    e.target.value='';
  };

  /* ---------- util ---------- */
  function autoGrow(ta){ ta.style.height='auto'; ta.style.height=Math.max(80,ta.scrollHeight+2)+'px'; }
  $$('.mask').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m){ if(m.id==='chkMask') closeChk(null); else m.classList.remove('on'); } }));

  fillSet(); renderList();
})();
</script>
</body>
</html>
